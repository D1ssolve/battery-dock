name: Build Windows EXE

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a new versioned release after all Windows checks pass (main only)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "battery_dock/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "requirements*.txt"
      - "run.py"
      - "build-windows.*"
      - "README*.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SUPPORT.md"
      - "ROADMAP.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "examples/**"
      - "LICENSE"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read release version
        id: version
        run: |
          $version = python -c "from scripts.package_windows import package_version; print(package_version())"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q battery_dock tests scripts run.py
      - name: Smoke-test Windows Tk lifecycle
        run: python -m scripts.smoke_windows_ui
      - name: Smoke-test Windows single-instance lifecycle
        run: python scripts/smoke-windows-instance.py
      - name: Capture actual demo UI screenshots
        run: python -m scripts.capture_screenshots
      - name: Upload demo screenshots for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BatteryDock-Screenshots-${{ github.run_number }}
          path: |
            docs/screenshots/*.png
            docs/screenshots/capture.json
          if-no-files-found: error
          retention-days: 30
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BatteryDock --collect-all pystray --hidden-import hid run.py
      - name: Smoke-test frozen executable without hardware
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'battery-dock-demo.json'
          $process = Start-Process -FilePath '.\dist\BatteryDock.exe' -ArgumentList '--demo', '--diagnose', ('"' + $report + '"') -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Frozen executable timed out.'
          }
          if ($process.ExitCode -ne 0) { throw 'Frozen executable failed.' }
          $data = Get-Content -Raw $report | ConvertFrom-Json
          if ($data.demo -ne $true) { throw 'Expected a demo diagnostic report.' }
      - name: Smoke-test opt-in external plugin in frozen executable
        run: python -m scripts.smoke_plugin_exe
      - name: Package source, licenses and binary
        run: python scripts/package_windows.py
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BatteryDock-Windows-x64-${{ github.run_number }}
          path: |
            dist/BatteryDock-${{ steps.version.outputs.version }}-Windows-x64.zip
            dist/BatteryDock-${{ steps.version.outputs.version }}-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    # Publishing is opt-in, never a side effect of an ordinary build.
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.release) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')))
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: battery-dock-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.windows.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      ARTIFACT_NAME: BatteryDock-Windows-x64-${{ github.run_number }}
    steps:
      - name: Download this run's tested package
        run: gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir package
      - name: Verify package and publish new release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid application release version.'; exit 1; }
          cd package
          archive="BatteryDock-${RELEASE_VERSION}-Windows-x64.zip"
          sha256sum --check "$archive.sha256"
          info=$(unzip -p "$archive" "BatteryDock-${RELEASE_VERSION}-Windows-x64/BUILD-INFO.json")
          package_version=$(printf '%s' "$info" | jq -r '.version')
          test "$package_version" = "$RELEASE_VERSION" || {
            echo "BUILD-INFO version mismatch: expected $RELEASE_VERSION, found $package_version"; exit 1;
          }
          package_commit=$(printf '%s' "$info" | jq -r '.commit')
          test "$package_commit" = "$RELEASE_SHA" || {
            echo "BUILD-INFO commit mismatch: expected $RELEASE_SHA, found $package_commit"; exit 1;
          }
          tag="v$RELEASE_VERSION"
          # Refuse every existing tag (including lightweight/annotated tags).
          # No force pushes, asset replacement, or edits to existing releases.
          matches=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length")
          test "$matches" = 0 || { echo 'Tag already exists; choose a new version.'; exit 1; }
          unzip -p "$archive" "BatteryDock-${RELEASE_VERSION}-Windows-x64/docs/RELEASE-NOTES.md" > notes.txt
          test "$(head -n 1 notes.txt | tr -d '\r')" = "# Battery Dock $RELEASE_VERSION" || {
            echo "Release notes heading does not match application version $RELEASE_VERSION"; exit 1;
          }
          printf '\nTested build commit: `%s`.\n' "$RELEASE_SHA" >> notes.txt
          # Stage assets in a draft so a failed upload cannot publish an empty release.
          gh release create "$tag" "$archive" "$archive.sha256" \
            --target "$RELEASE_SHA" --title "Battery Dock $RELEASE_VERSION" \
            --notes-file notes.txt --draft
          gh release edit "$tag" --draft=false --latest
