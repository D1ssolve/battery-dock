name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "battery_dock/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "requirements*.txt"
      - "run.py"
      - "build-windows.*"
      - "README*.md"
      - "CONTRIBUTING.md"
      - "examples/**"
      - "LICENSE"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q battery_dock tests scripts run.py
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BatteryDock --collect-all pystray --hidden-import hid run.py
      - name: Smoke-test frozen executable without hardware
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'battery-dock-demo.json'
          $process = Start-Process -FilePath '.\dist\BatteryDock.exe' -ArgumentList '--demo', '--diagnose', ('"' + $report + '"') -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Frozen executable timed out.'
          }
          if ($process.ExitCode -ne 0) { throw 'Frozen executable failed.' }
          $data = Get-Content -Raw $report | ConvertFrom-Json
          if ($data.demo -ne $true) { throw 'Expected a demo diagnostic report.' }
      - name: Smoke-test opt-in external plugin in frozen executable
        run: python -m scripts.smoke_plugin_exe
      - name: Package source, licenses and binary
        run: python scripts/package_windows.py
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BatteryDock-Windows-x64-${{ github.run_number }}
          path: dist/BatteryDock-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
